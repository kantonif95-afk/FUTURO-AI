
workflows:
  android-apk:
    name: FUTURO AI Actualizado
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Extraer proyecto nuevo
        script: |
          echo "Archivos disponibles:"
          ls -la
          echo "Buscando el ZIP:"
          find . -maxdepth 3 -iname "*.zip"
          unzip -o "./FUTURO_AI_Android_v2.zip" -d android_project
      - name: Compilar APK
        script: |
          cd android_project
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android_project/app/build/outputs/apk/debug/*.apk

workflows:
  android-apk:
    name: FUTURO AI Android APK
    max_build_duration: 60
    environment:
      android: latest
      java: 17
    scripts:
      - name: Extract Android project
        script: |
          unzip -o FUTURO_AI_Proyecto_Android.zip -d .
      - name: Build debug APK
        script: |
          gradle --version
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

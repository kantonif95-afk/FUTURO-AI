
workflows:
  android-apk:
    name: FUTURO AI Actualizado
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Extraer proyecto nuevo
        script: |
          echo "Revisando archivos del proyecto"
          ls -la
          echo "Extrayendo aplicación FUTURO AI"
          unzip -o "./FUTURO_AI_Android_v2(1).zip" -d android_project
          echo "Proyecto extraído correctamente"
      - name: Compilar APK
        script: |
          cd android_project
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android_project/app/build/outputs/apk/debug/*.apk
